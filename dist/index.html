<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Blackthorn Blade</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111927;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas {
      display: block;
      touch-action: none;
    }
    #playAgainBtn {
      display: none;
      margin-top: 12px;
      padding: 14px 40px;
      font-size: 18px;
      font-family: sans-serif;
      font-weight: bold;
      background: #d4a24e;
      color: #111927;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      min-width: 160px;
      min-height: 48px;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <button id="playAgainBtn">Play Again</button>
  <script>
    /* ===== CADEPLAY SDK INIT ===== */
    if (window.CadeplaySDK) {
      CadeplaySDK.gameLoadingStart();
    }

    /* ===== SETUP ===== */
    const cvs = document.getElementById('gameCanvas');
    const ctx = cvs.getContext('2d');
    const paBtn = document.getElementById('playAgainBtn');

    function resize() {
      cvs.width  = Math.min(window.innerWidth - 16, 420);
      cvs.height = Math.min(window.innerHeight - 80, 680);
    }
    window.addEventListener('resize', resize);
    resize();

    if (window.CadeplaySDK) {
      CadeplaySDK.gameLoadingFinished();
    }

    /* 5-Color palette */
    const C = { bg:'#111927', gold:'#d4a24e', red:'#c0392b', panel:'#1b2838', text:'#f0e6d3' };

    /* Screen states */
    const SC = { TITLE:0, INTRO:1, PLAY:2, TWIST:3, OUTCOME:4, OVER:5, COMPLETE:6, FAILED:7 };

    /* ===== QUEST DATA ===== */
    const Q = {
      name: 'The Blackthorn Blade',
      hook: 'The legendary sword Blackthorn has been stolen from the royal vault by a rogue knight and spirited away to a marsh fortress. Without the blade\'s return before the coronation moon, civil war will consume the realm.',
      obj: 'Infiltrate Fenhollow Fortress, retrieve the Blackthorn Blade, and escape alive.',
      steps: [
        { t:'Step 1 of 4: Traverse the Marshes', d:'Tap when the sentry beam is AWAY from the path to sneak forward. Don\'t get caught! You have 3 lives.' },
        { t:'Step 2 of 4: Defeat the Captain',   d:'Tap the red target to strike the brigand captain. Land 5 hits before time runs out!' },
        { t:'Step 3 of 4: Retrieve the Blade',    d:'Watch which chest glows gold, then tap it. Get 3 correct. You have 3 lives!' },
        { t:'Step 4 of 4: Escape the Tunnels',    d:'Tap as fast as you can to fill the escape bar before time runs out!' }
      ],
      twist: 'Sir Caedan, the rogue knight, confronts you. He reveals the blade was stolen to prevent a corrupt advisor from using its enchantment to control the new queen. You must choose what to do with the blade.',
      opts: ['Return blade to the Crown', 'Surrender blade to Sir Caedan'],
      outs: [
        { t:'You return the Blackthorn Blade to the queen, securing her authority and averting civil war. The corrupt advisor\'s schemes remain hidden, but the crown rewards your loyalty generously.',
          r:['2,500 Gold Crowns & 3,000 XP','Blackthorn Signet Ring (+15 Authority)','+400 Royal Court Reputation'] },
        { t:'You surrender the blade to Sir Caedan, who destroys the enchantment forever. The court brands you a traitor, but the Order of the Veil honours you as a true knight.',
          r:['1,500 Gold Crowns & 3,000 XP','Veil Knight\'s Medallion (+15 Stealth)','+400 Order of the Veil Reputation'] }
      ]
    };

    const FAIL_MSGS = [
      'You were spotted by the sentries!',
      'Time\'s up! The captain overpowered you!',
      'The reliquary chambers have sealed!',
      'The tunnels collapsed around you!'
    ];

    const STEP_NAMES = ['Traverse the Marshes', 'Defeat the Captain', 'Retrieve the Blade', 'Escape the Tunnels'];

    /* ===== GAME STATE ===== */
    let scr, score, step, choice, sd, fb, fbT;
    let scoreGlow = 0, popups = [], stepScore = 0, compStart = 0, failMsg = '';

    function resetGame() {
      if (window.CadeplaySDK) {
        CadeplaySDK.gameplayStop();
      }
      scr = SC.TITLE; score = 0; step = 0; choice = -1;
      sd = {}; fb = ''; fbT = 0;
      scoreGlow = 0; popups = []; stepScore = 0; compStart = 0; failMsg = '';
      paBtn.style.display = 'none';
    }
    resetGame();

    /* ===== HELPERS ===== */
    function wrap(text, x, y, mw, lh) {
      const words = text.split(' ');
      let line = '', cy = y;
      for (const w of words) {
        const t = line + w + ' ';
        if (ctx.measureText(t).width > mw && line) {
          ctx.fillText(line.trim(), x, cy); line = w + ' '; cy += lh;
        } else { line = t; }
      }
      if (line) { ctx.fillText(line.trim(), x, cy); cy += lh; }
      return cy;
    }

    function inR(px, py, rx, ry, rw, rh) {
      return px >= rx && px <= rx + rw && py >= ry && py <= ry + rh;
    }

    function rRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y);
      ctx.quadraticCurveTo(x+w, y, x+w, y+r);
      ctx.lineTo(x+w, y+h-r);
      ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
      ctx.lineTo(x+r, y+h);
      ctx.quadraticCurveTo(x, y+h, x, y+h-r);
      ctx.lineTo(x, y+r);
      ctx.quadraticCurveTo(x, y, x+r, y);
      ctx.closePath(); ctx.fill();
    }

    function sRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y);
      ctx.quadraticCurveTo(x+w, y, x+w, y+r);
      ctx.lineTo(x+w, y+h-r);
      ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
      ctx.lineTo(x+r, y+h);
      ctx.quadraticCurveTo(x, y+h, x, y+h-r);
      ctx.lineTo(x, y+r);
      ctx.quadraticCurveTo(x, y, x+r, y);
      ctx.closePath(); ctx.stroke();
    }

    /* Score animation helpers */
    function addScore(pts) {
      if (pts <= 0) return;
      score += pts;
      scoreGlow = 25;
      popups.push({ text: '+' + pts, x: 100, y: 16, alpha: 1.3 });
    }

    function updatePopups() {
      if (scoreGlow > 0) scoreGlow--;
      for (let i = popups.length - 1; i >= 0; i--) {
        popups[i].y -= 1.1;
        popups[i].alpha -= 0.028;
        if (popups[i].alpha <= 0) popups.splice(i, 1);
      }
    }

    /* ===== INPUT (Unified Pointer Events) ===== */
    let tx = -1, ty = -1, tap = false;

    function onTap(cx, cy) {
      const r = cvs.getBoundingClientRect();
      tx = cx - r.left; ty = cy - r.top; tap = true;
    }

    cvs.addEventListener('pointerdown', e => {
      e.preventDefault();
      cvs.setPointerCapture(e.pointerId);
      onTap(e.clientX, e.clientY);
    });

    paBtn.addEventListener('pointerdown', e => {
      e.preventDefault();
      resetGame();
    });

    /* ===== STEP HELPERS ===== */
    function initStep() {
      fb = ''; fbT = 0;
      if (step === 0)      sd = { bx:0, bd:1, bs:2.5, adv:0, lives:3 };
      else if (step === 1)  { sd = { hp:5, hf:0, timer:720 }; placeC(); }
      else if (step === 2)  { sd = { rnd:0, ph:'show', tmr:0, ci:ri(), lives:3 }; }
      else if (step === 3)  sd = { fill:0, tl:480, done:false, dt:0, result:'' };
    }

    function ri()     { return Math.floor(Math.random() * 4); }
    function placeC() {
      sd.cx = 60 + Math.random() * (cvs.width - 120);
      sd.cy = 120 + Math.random() * (cvs.height - 280);
      sd.r  = 28;
    }

    function getChests() {
      const w = 80, h = 70, g = 24;
      const tw = 2*w + g, sx = (cvs.width - tw) / 2, sy = cvs.height / 2 - 60;
      return [
        { x:sx,       y:sy,       w, h },
        { x:sx+w+g,   y:sy,       w, h },
        { x:sx,       y:sy+h+g,   w, h },
        { x:sx+w+g,   y:sy+h+g,   w, h }
      ];
    }

    /* Twist button geometry */
    function twistBtns() {
      const bw = 240, bh = 56, bx = cvs.width/2 - bw/2;
      const by1 = cvs.height * 0.55;
      return { bw, bh, bx, by1, by2: by1 + bh + 18 };
    }

    /* Failed screen button geometry */
    function failBtns() {
      const bw = 140, bh = 52, gap = 20;
      const totalW = bw * 2 + gap;
      const bx1 = cvs.width / 2 - totalW / 2;
      const by = cvs.height / 2 + 70;
      return { bw, bh, retryX: bx1, quitX: bx1 + bw + gap, by };
    }

    function stepComplete() {
      /* Bonus for remaining lives / time */
      if (step === 0) addScore(sd.lives * 50);
      else if (step === 1) addScore(Math.floor(sd.timer / 60) * 10);
      else if (step === 2) addScore(sd.lives * 100);
      compStart = Date.now();
      scr = SC.COMPLETE;
    }

    function stepFail() {
      if (window.CadeplaySDK) {
        CadeplaySDK.gameplayStop();
      }
      score = stepScore; /* Revert points earned during failed attempt */
      popups = [];
      failMsg = FAIL_MSGS[step];
      scr = SC.FAILED;
    }

    /* ===== UPDATE ===== */
    function update() {
      if (scr === SC.TITLE && tap) {
        scr = SC.INTRO; initStep();
      }
      else if (scr === SC.INTRO && tap) {
        scr = SC.PLAY; stepScore = score; initStep();
        if (window.CadeplaySDK) {
          CadeplaySDK.gameplayStart();
        }
      }
      else if (scr === SC.PLAY) {
        if (fbT > 0) { fbT--; if (!fbT) fb = ''; }
        updatePlay();
      }
      else if (scr === SC.COMPLETE) {
        const elapsed = Date.now() - compStart;
        if (elapsed >= 3000 || (tap && elapsed >= 2000)) {
          step++;
          scr = step >= 4 ? SC.TWIST : SC.INTRO;
        }
      }
      else if (scr === SC.FAILED && tap) {
        const b = failBtns();
        if (inR(tx, ty, b.retryX, b.by, b.bw, b.bh)) {
          scr = SC.INTRO; /* Retry same step */
        }
        else if (inR(tx, ty, b.quitX, b.by, b.bw, b.bh)) {
          resetGame(); /* Back to title */
        }
      }
      else if (scr === SC.TWIST && tap) {
        const b = twistBtns();
        if (inR(tx, ty, b.bx, b.by1, b.bw, b.bh))      { choice = 0; scr = SC.OUTCOME; }
        else if (inR(tx, ty, b.bx, b.by2, b.bw, b.bh))  { choice = 1; scr = SC.OUTCOME; }
      }
      else if (scr === SC.OUTCOME && tap) {
        scr = SC.OVER; paBtn.style.display = 'block';
        if (window.CadeplaySDK) {
          CadeplaySDK.gameplayStop();
          CadeplaySDK.submitScore('main', score);
        }
      }
    }

    function updatePlay() {
      /* Step 0 — Stealth: 3 lives, 3 advances to clear */
      if (step === 0) {
        sd.bx += sd.bs * sd.bd;
        if (sd.bx > cvs.width - 60) sd.bd = -1;
        if (sd.bx < 0)              sd.bd =  1;
        if (tap) {
          const safe = Math.abs((sd.bx + 30) - cvs.width / 2) > 90;
          if (safe) {
            sd.adv++; addScore(100); sd.bs += 0.6;
            fb = '✓ Safe!'; fbT = 35;
            if (sd.adv >= 3) { stepComplete(); return; }
          } else {
            sd.lives--;
            fb = '✗ Caught!'; fbT = 40;
            if (sd.lives <= 0) { stepFail(); return; }
          }
        }

      /* Step 1 — Combat: 12s timer, 5 hits to clear */
      } else if (step === 1) {
        sd.timer--;
        if (sd.hf > 0) sd.hf--;
        if (sd.timer <= 0) { stepFail(); return; }
        if (tap) {
          const dx = tx - sd.cx, dy = ty - sd.cy;
          if (dx*dx + dy*dy <= sd.r * sd.r) {
            sd.hp--; addScore(100); sd.hf = 12;
            fb = '⚔ Hit!'; fbT = 25;
            if (sd.hp <= 0) { stepComplete(); return; }
            placeC();
          } else {
            fb = '✗ Miss!'; fbT = 20;
          }
        }

      /* Step 2 — Search: 3 lives, 3 correct to clear */
      } else if (step === 2) {
        if (sd.ph === 'show') {
          sd.tmr++;
          if (sd.tmr > 50) { sd.ph = 'choose'; sd.tmr = 0; }
        }
        if (sd.ph === 'choose' && tap) {
          const cs = getChests();
          for (let i = 0; i < 4; i++) {
            if (inR(tx, ty, cs[i].x, cs[i].y, cs[i].w, cs[i].h)) {
              if (i === sd.ci) {
                addScore(150); fb = '✓ Correct!'; fbT = 35;
                sd.rnd++;
                if (sd.rnd >= 3) { stepComplete(); return; }
              } else {
                sd.lives--;
                fb = '✗ Wrong!'; fbT = 35;
                if (sd.lives <= 0) { stepFail(); return; }
              }
              /* Reshuffle for next round */
              sd.ci = ri(); sd.ph = 'show'; sd.tmr = 0;
              break;
            }
          }
        }

      /* Step 3 — Escape: 8s timer, fill bar to clear */
      } else if (step === 3) {
        if (!sd.done) {
          sd.tl--;
          if (tap) { sd.fill = Math.min(100, sd.fill + 3.5); addScore(20); }
          if (sd.fill >= 100) {
            sd.done = true; sd.result = 'pass'; addScore(200);
            fb = '✓ Escaped!'; fbT = 70; sd.dt = 70;
          } else if (sd.tl <= 0) {
            sd.done = true; sd.result = 'fail';
            fb = '✗ Too slow!'; fbT = 70; sd.dt = 70;
          }
        } else {
          sd.dt--;
          if (sd.dt <= 0) {
            if (sd.result === 'pass') stepComplete();
            else stepFail();
          }
        }
      }
    }

    /* ===== DRAW ===== */
    function draw() {
      ctx.fillStyle = C.bg;
      ctx.fillRect(0, 0, cvs.width, cvs.height);

      if      (scr === SC.TITLE)    drawTitle();
      else if (scr === SC.INTRO)    drawIntro();
      else if (scr === SC.PLAY)     drawPlay();
      else if (scr === SC.COMPLETE) drawComplete();
      else if (scr === SC.FAILED)   drawFailed();
      else if (scr === SC.TWIST)    drawTwist();
      else if (scr === SC.OUTCOME)  drawOutcome();
      else if (scr === SC.OVER)     drawOver();
    }

    /* --- Screen 1: Title & Objective --- */
    function drawTitle() {
      const cx = cvs.width / 2, pad = 20, mw = cvs.width - pad * 2;
      ctx.textAlign = 'center';

      ctx.fillStyle = C.gold;
      ctx.font = 'bold 26px sans-serif';
      ctx.fillText(Q.name, cx, 90);
      ctx.fillRect(cx - 60, 105, 120, 2);

      ctx.fillStyle = C.text;
      ctx.font = '14px sans-serif';
      let ny = wrap(Q.hook, cx, 140, mw, 21);

      ctx.fillStyle = C.gold;
      ctx.font = 'bold 14px sans-serif';
      ny = wrap('Objective: ' + Q.obj, cx, ny + 16, mw, 21);

      ctx.fillStyle = C.text;
      ctx.font = 'italic 13px sans-serif';
      ctx.fillText('Quest Giver: Sir Aldric Wynn (Honorable but haunted)', cx, ny + 20);

      ctx.fillStyle = C.gold;
      ctx.font = 'bold 18px sans-serif';
      const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 400);
      ctx.globalAlpha = 0.6 + 0.4 * pulse;
      ctx.fillText('Tap or Click to Begin', cx, cvs.height - 55);
      ctx.globalAlpha = 1;
    }

    /* --- Screen 2a: Step Intro --- */
    function drawIntro() {
      const cx = cvs.width / 2, pad = 24, mw = cvs.width - pad * 2;
      const s = Q.steps[step];
      ctx.textAlign = 'center';

      ctx.fillStyle = C.gold;
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText(s.t, cx, cvs.height / 2 - 60);

      ctx.fillStyle = C.text;
      ctx.font = '15px sans-serif';
      wrap(s.d, cx, cvs.height / 2 - 10, mw, 22);

      ctx.fillStyle = C.gold;
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText('Tap to Start', cx, cvs.height / 2 + 80);

      drawHUD();
    }

    /* --- Screen 2b: Gameplay --- */
    function drawPlay() {
      drawHUD();

      ctx.textAlign = 'right';
      ctx.fillStyle = C.gold;
      ctx.font = '12px sans-serif';
      ctx.fillText(Q.steps[step].t, cvs.width - 14, 26);

      if      (step === 0) drawStealth();
      else if (step === 1) drawCombat();
      else if (step === 2) drawSearch();
      else if (step === 3) drawEscape();

      if (fb) {
        ctx.textAlign = 'center';
        ctx.font = 'bold 22px sans-serif';
        ctx.fillStyle = fb.startsWith('✓') || fb.startsWith('⚔') ? C.gold : C.red;
        ctx.fillText(fb, cvs.width / 2, cvs.height - 45);
      }
    }

    function drawHUD() {
      const glowing = scoreGlow > 0;
      const sz = glowing ? 17 : 14;
      ctx.fillStyle = glowing ? C.gold : C.text;
      ctx.textAlign = 'left';
      ctx.font = 'bold ' + sz + 'px sans-serif';
      ctx.fillText('Score: ' + score, 14, glowing ? 28 : 26);

      for (const p of popups) {
        ctx.globalAlpha = Math.max(0, Math.min(1, p.alpha));
        ctx.fillStyle = C.gold;
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(p.text, p.x, p.y);
        ctx.globalAlpha = 1;
      }
    }

    /* Draw lives as hearts */
    function drawLives(lives, max, x, y) {
      ctx.font = '18px sans-serif';
      ctx.textAlign = 'left';
      let str = '';
      for (let i = 0; i < max; i++) str += i < lives ? '❤️ ' : '🖤 ';
      ctx.fillText(str, x, y);
    }

    /* Draw timer bar */
    function drawTimerBar(current, max, y) {
      const bw = cvs.width - 80, bh = 12;
      const bx = 40;
      const pct = Math.max(0, current / max);
      ctx.fillStyle = C.panel;
      rRect(bx, y, bw, bh, 4);
      ctx.fillStyle = pct > 0.3 ? C.gold : C.red;
      rRect(bx, y, bw * pct, bh, 4);
      ctx.fillStyle = C.text; ctx.textAlign = 'center'; ctx.font = '12px sans-serif';
      ctx.fillText('⏱ ' + Math.max(0, (current / 60).toFixed(1)) + 's', cvs.width / 2, y - 6);
    }

    /* Step 0 — Stealth */
    function drawStealth() {
      const cx = cvs.width / 2, ch = cvs.height;

      /* Lives */
      drawLives(sd.lives, 3, 14, 52);

      ctx.fillStyle = C.panel;
      ctx.fillRect(0, ch - 110, cvs.width, 110);

      ctx.fillStyle = C.gold;
      for (let y = 65; y < ch - 110; y += 20) ctx.fillRect(cx - 2, y, 4, 10);

      ctx.fillStyle = C.red; ctx.globalAlpha = 0.3;
      ctx.fillRect(sd.bx, 55, 60, ch - 165);
      ctx.globalAlpha = 1;

      const safe = Math.abs((sd.bx + 30) - cx) > 90;
      ctx.textAlign = 'center';
      ctx.font = 'bold 16px sans-serif';
      ctx.fillStyle = safe ? C.gold : C.red;
      ctx.fillText(safe ? '● SAFE — Tap now!' : '● DANGER — Wait!', cx, ch - 80);

      const py = ch - 130 - sd.adv * 90;
      ctx.fillStyle = C.gold;
      ctx.beginPath(); ctx.arc(cx, py, 12, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = C.text; ctx.font = '13px sans-serif';
      ctx.fillText('Advances: ' + sd.adv + ' / 3', cx, 62);
    }

    /* Step 1 — Combat */
    function drawCombat() {
      ctx.fillStyle = C.panel;
      rRect(16, 70, cvs.width - 32, cvs.height - 160, 8);

      /* Timer bar */
      drawTimerBar(sd.timer, 720, 55);

      /* Captain */
      ctx.fillStyle = sd.hf > 0 ? C.gold : C.red;
      ctx.beginPath(); ctx.arc(sd.cx, sd.cy, sd.r, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = C.text; ctx.textAlign = 'center';
      ctx.font = '11px sans-serif';
      ctx.fillText('⚔ Captain', sd.cx, sd.cy + sd.r + 16);

      /* HP bar */
      const bw = 140, bh = 14, bx = cvs.width/2 - bw/2, by = cvs.height - 65;
      ctx.fillStyle = C.panel; ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = C.red;   ctx.fillRect(bx, by, bw * (sd.hp / 5), bh);
      ctx.fillStyle = C.text; ctx.font = '12px sans-serif';
      ctx.fillText('HP: ' + sd.hp + ' / 5', cvs.width / 2, by - 6);
    }

    /* Step 2 — Search */
    function drawSearch() {
      const cs = getChests();
      ctx.textAlign = 'center';

      /* Lives */
      drawLives(sd.lives, 3, 14, 52);

      ctx.fillStyle = C.text; ctx.font = '14px sans-serif';
      ctx.fillText(sd.ph === 'show' ? 'Watch closely...' : 'Which chest had the glow?', cvs.width/2, cs[0].y - 30);

      for (let i = 0; i < 4; i++) {
        const c = cs[i];
        ctx.fillStyle = (sd.ph === 'show' && i === sd.ci) ? C.gold : C.panel;
        rRect(c.x, c.y, c.w, c.h, 6);
        ctx.strokeStyle = C.gold; ctx.lineWidth = 2;
        sRect(c.x, c.y, c.w, c.h, 6);
        ctx.fillStyle = C.text; ctx.font = '26px sans-serif';
        ctx.fillText('📦', c.x + c.w/2, c.y + c.h/2 + 9);
      }

      ctx.fillStyle = C.text; ctx.font = '13px sans-serif';
      ctx.fillText('Correct: ' + sd.rnd + ' / 3', cvs.width/2, cs[3].y + cs[3].h + 36);
    }

    /* Step 3 — Escape */
    function drawEscape() {
      const cx = cvs.width / 2, bw = cvs.width - 80, bh = 26;

      ctx.fillStyle = C.text; ctx.textAlign = 'center'; ctx.font = '13px sans-serif';
      ctx.fillText('Escape: ' + Math.floor(sd.fill) + '%', cx, cvs.height/2 - 58);
      ctx.fillStyle = C.panel; rRect(40, cvs.height/2 - 48, bw, bh, 6);
      ctx.fillStyle = C.gold;  rRect(40, cvs.height/2 - 48, Math.max(0, bw * sd.fill / 100), bh, 6);

      ctx.fillStyle = C.text; ctx.font = '13px sans-serif';
      ctx.fillText('Time: ' + Math.max(0, (sd.tl / 60).toFixed(1)) + 's', cx, cvs.height/2 + 4);
      ctx.fillStyle = C.panel; rRect(40, cvs.height/2 + 14, bw, bh, 6);
      const timePct = Math.max(0, sd.tl / 480);
      ctx.fillStyle = timePct > 0.3 ? C.red : C.red;
      rRect(40, cvs.height/2 + 14, Math.max(0, bw * timePct), bh, 6);

      if (!sd.done) {
        ctx.fillStyle = C.gold; ctx.font = 'bold 22px sans-serif';
        const pulse = 0.6 + 0.4 * Math.sin(Date.now() / 150);
        ctx.globalAlpha = pulse;
        ctx.fillText('TAP TAP TAP!', cx, cvs.height/2 + 90);
        ctx.globalAlpha = 1;
      }
    }

    /* --- Step Complete Transition --- */
    function drawComplete() {
      const cx = cvs.width / 2;
      const earned = score - stepScore;
      ctx.textAlign = 'center';

      /* Animated checkmark */
      const progress = Math.min(1, (Date.now() - compStart) / 3000);
      const scale = Math.min(1, progress * 2.5);
      ctx.fillStyle = C.gold;
      ctx.font = 'bold ' + Math.floor(48 * scale) + 'px sans-serif';
      ctx.fillText('✓', cx, cvs.height / 2 - 70);

      ctx.font = 'bold 24px sans-serif';
      ctx.fillText('Step Complete!', cx, cvs.height / 2 - 15);

      ctx.fillStyle = C.text;
      ctx.font = '16px sans-serif';
      ctx.fillText(STEP_NAMES[step], cx, cvs.height / 2 + 20);

      if (earned > 0) {
        ctx.fillStyle = C.gold;
        ctx.font = 'bold 20px sans-serif';
        ctx.fillText('+' + earned + ' points', cx, cvs.height / 2 + 65);
      }

      /* Progress bar */
      const bw = 200, bh = 8, bx = cx - bw / 2, by = cvs.height / 2 + 100;
      ctx.fillStyle = C.panel; rRect(bx, by, bw, bh, 4);
      ctx.fillStyle = C.gold;  rRect(bx, by, bw * ((step + 1) / 4), bh, 4);
      ctx.fillStyle = C.text; ctx.font = '12px sans-serif';
      ctx.fillText((step + 1) + ' of 4 steps complete', cx, by + 24);

      drawHUD();
    }

    /* --- Mission Failed Screen --- */
    function drawFailed() {
      const cx = cvs.width / 2;
      ctx.textAlign = 'center';

      /* Red tint overlay */
      ctx.fillStyle = 'rgba(192, 57, 43, 0.12)';
      ctx.fillRect(0, 0, cvs.width, cvs.height);

      /* X mark */
      ctx.fillStyle = C.red;
      ctx.font = 'bold 52px sans-serif';
      ctx.fillText('✗', cx, cvs.height / 2 - 80);

      /* Heading */
      ctx.font = 'bold 26px sans-serif';
      ctx.fillText('Mission Failed', cx, cvs.height / 2 - 25);

      /* Fail reason */
      ctx.fillStyle = C.text;
      ctx.font = '15px sans-serif';
      ctx.fillText(failMsg, cx, cvs.height / 2 + 10);

      /* Step name */
      ctx.fillStyle = C.gold;
      ctx.font = 'italic 13px sans-serif';
      ctx.fillText(STEP_NAMES[step], cx, cvs.height / 2 + 38);

      /* Buttons */
      const b = failBtns();

      /* Retry button */
      ctx.fillStyle = C.gold;
      rRect(b.retryX, b.by, b.bw, b.bh, 8);
      ctx.fillStyle = C.bg;
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText('Retry', b.retryX + b.bw / 2, b.by + b.bh / 2 + 6);

      /* Quit button */
      ctx.fillStyle = C.panel;
      rRect(b.quitX, b.by, b.bw, b.bh, 8);
      ctx.strokeStyle = C.text; ctx.lineWidth = 2;
      sRect(b.quitX, b.by, b.bw, b.bh, 8);
      ctx.fillStyle = C.text;
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText('Quit', b.quitX + b.bw / 2, b.by + b.bh / 2 + 6);

      drawHUD();
    }

    /* --- Screen 3: Twist Choice --- */
    function drawTwist() {
      const cx = cvs.width / 2, pad = 24, mw = cvs.width - pad * 2;
      ctx.textAlign = 'center';

      ctx.fillStyle = C.red; ctx.font = 'bold 22px sans-serif';
      ctx.fillText('⚔ The Twist', cx, 75);
      ctx.fillStyle = C.gold; ctx.fillRect(cx - 40, 90, 80, 2);

      ctx.fillStyle = C.text; ctx.font = '14px sans-serif';
      wrap(Q.twist, cx, 120, mw, 21);

      const b = twistBtns();

      ctx.fillStyle = C.gold;
      rRect(b.bx, b.by1, b.bw, b.bh, 8);
      ctx.fillStyle = C.bg; ctx.font = 'bold 15px sans-serif';
      ctx.fillText(Q.opts[0], cx, b.by1 + b.bh / 2 + 5);

      ctx.fillStyle = C.panel;
      rRect(b.bx, b.by2, b.bw, b.bh, 8);
      ctx.strokeStyle = C.gold; ctx.lineWidth = 2;
      sRect(b.bx, b.by2, b.bw, b.bh, 8);
      ctx.fillStyle = C.gold; ctx.font = 'bold 15px sans-serif';
      ctx.fillText(Q.opts[1], cx, b.by2 + b.bh / 2 + 5);

      drawHUD();
    }

    /* --- Screen 4: Outcome & Rewards --- */
    function drawOutcome() {
      const cx = cvs.width / 2, pad = 24, mw = cvs.width - pad * 2;
      const o = Q.outs[choice];
      ctx.textAlign = 'center';

      ctx.fillStyle = C.gold; ctx.font = 'bold 20px sans-serif';
      ctx.fillText('Outcome', cx, 70);
      ctx.fillRect(cx - 40, 84, 80, 2);

      ctx.fillStyle = C.text; ctx.font = '14px sans-serif';
      let ny = wrap(o.t, cx, 115, mw, 21);

      ny = Math.max(ny + 16, 260);
      ctx.fillStyle = C.gold; ctx.font = 'bold 16px sans-serif';
      ctx.fillText('— Rewards —', cx, ny); ny += 8;
      ctx.font = '14px sans-serif'; ctx.fillStyle = C.text;
      for (const r of o.r) { ny += 24; ctx.fillText('• ' + r, cx, ny); }

      ny += 40;
      ctx.fillStyle = C.gold; ctx.font = 'bold 22px sans-serif';
      ctx.fillText('Score: ' + score, cx, ny);

      ctx.fillStyle = C.text; ctx.font = '14px sans-serif';
      ctx.fillText('Tap to continue', cx, cvs.height - 45);
    }

    /* --- Screen 5: Quest Complete --- */
    function drawOver() {
      const cx = cvs.width / 2;
      ctx.textAlign = 'center';

      ctx.fillStyle = C.gold; ctx.font = 'bold 28px sans-serif';
      ctx.fillText('Quest Complete', cx, cvs.height / 2 - 50);
      ctx.fillRect(cx - 60, cvs.height / 2 - 32, 120, 2);

      ctx.fillStyle = C.text; ctx.font = '20px sans-serif';
      ctx.fillText('Final Score: ' + score, cx, cvs.height / 2 + 10);

      ctx.fillStyle = C.text; ctx.font = 'italic 14px sans-serif';
      ctx.fillText(Q.name, cx, cvs.height / 2 + 45);
    }

    /* ===== GAME LOOP (requestAnimationFrame only) ===== */
    function loop() {
      update();
      updatePopups();
      draw();
      tap = false;
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
